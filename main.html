<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Voiceinator 5000</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto+Slab:wght@300;400;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="frame" role="application" aria-label="Voiceinator">
    <div class="side-teal" aria-hidden="true"></div>

    <div class="card" id="voiceCard">
      <div class="header">
        <div class="title">The Voiceinator 5000</div>
      </div>

      <div class="content">
        <div>
          <label for="voiceSelect">Voice</label>
          <select id="voiceSelect" aria-label="Choose voice"></select>
        </div>

        <div class="controls">
          <div class="slider-row">
            <div class="name">Rate:</div>
            <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
          </div>

          <div class="slider-row">
            <div class="name">Pitch:</div>
            <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
          </div>
        </div>

        <div>
          <label for="text">Text to speak</label>
          <textarea id="text">Hello! I love JavaScript 👍</textarea>
        </div>

        <div class="actions" role="group" aria-label="Speech controls">
          <button class="btn stop" id="stopBtn" title="Stop speaking">Stop!</button>
          <button class="btn" id="speakBtn" title="Speak text">Speak</button>
        </div>
      </div>
    </div>

    <div class="side-teal" aria-hidden="true"></div>
  </div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
